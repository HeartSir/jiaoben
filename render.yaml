# 🏸 川大场馆抢订系统 - Render 部署配置
#
# 部署后操作：
#   1. 设置环境变量 DASHBOARD_PASSWORD（可选面板密码）
#   2. 进面板后用「粘贴 Token」功能登录
#   3. 用 UptimeRobot 或 cron-job.org 每 5 分钟 ping 一次防止休眠
#
# 注意：免费版不支持持久化磁盘，重启后需重新贴 Token

services:
  - type: web
    name: venue-booking
    runtime: node
    repo: https://github.com/HeartSir/jiaoben
    region: singapore  # 东南亚节点，访问川大系统更快
    plan: free
    buildCommand: npm install && npx playwright install chromium --with-deps
    startCommand: node dashboard.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "3456"
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/.cache/ms-playwright
      - key: DASHBOARD_PASSWORD
        sync: false  # 部署后在 Render 面板手动设置
