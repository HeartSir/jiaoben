# render.yaml - Render Blueprint
# 一键部署到 Render

services:
  - type: web
    name: venue-booking
    env: node
    buildCommand: PLAYWRIGHT_BROWSERS_PATH=0 npm install && npx playwright install chromium chromium-headless-shell
    startCommand: PLAYWRIGHT_BROWSERS_PATH=0 node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
